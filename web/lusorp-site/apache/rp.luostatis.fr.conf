# Site LUSO RP - Apache 2.4 + PHP
# Fichier a copier dans /etc/apache2/sites-available/rp.luostatis.fr.conf (voir LISEZMOI.md)
# Le bloc HTTPS (port 443) est ajoute automatiquement par certbot (--apache).

<VirtualHost *:80>
    ServerName rp.luostatis.fr
    ServerAdmin webmaster@luostatis.fr

    # seul le dossier public/ est servi : app/ (config, code PHP) reste hors de portee du navigateur
    DocumentRoot /var/www/lusorp/public

    <Directory /var/www/lusorp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    <Directory /var/www/lusorp/app>
        Require all denied
    </Directory>

    # administration (rp.luostatis.fr/admin) : images jusqu'a 10 Mo
    <Directory /var/www/lusorp/public/admin>
        <IfModule php_module>
            php_value upload_max_filesize 12M
            php_value post_max_size 14M
        </IfModule>
    </Directory>

    # en-tetes de securite
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
    </IfModule>

    # cache des images, polices, CSS et JS (les fichiers CSS/JS ont un ?v= dans index.php)
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType image/webp "access plus 30 days"
        ExpiresByType image/jpeg "access plus 30 days"
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
    </IfModule>

    # compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/lusorp_error.log
    CustomLog ${APACHE_LOG_DIR}/lusorp_access.log combined
</VirtualHost>
